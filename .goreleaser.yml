# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: optgen

builds:
  - id: optgen
    main: ./cmd/optgen
    binary: optgen
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/altessa-s/go-optgen/internal/rootcmd.version={{ .Tag }}

archives:
  - id: optgen
    ids: [optgen]
    name_template: "optgen_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - COPYRIGHT
      - src: cmd/optgen/README.md
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  format: "{{ .Message }}"
  groups:
    # Subjects are anchored at the start so a type named later in the
    # subject (docs: explain feat!: syntax) does not decide the group; an
    # entry lands in the first group whose regexp matches.
    - title: Breaking Changes
      regexp: '^[a-z]+(\([^)]+\))?!:'
      order: 0
    - title: Features
      regexp: '^feat(\([^)]+\))?:'
      order: 1
    - title: Bug Fixes
      regexp: '^fix(\([^)]+\))?:'
      order: 2
    - title: Performance
      regexp: '^perf(\([^)]+\))?:'
      order: 3
    - title: Refactoring
      regexp: '^refactor(\([^)]+\))?:'
      order: 4
    - title: Documentation
      regexp: '^docs(\([^)]+\))?:'
      order: 5
    - title: Other
      order: 999
  filters:
    exclude:
      # Non-breaking ci, chore and test commits only; a breaking one (chore!:)
      # stays in the notes under Breaking Changes.
      - '^(ci|chore|test)(\([^)]*\))?:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: altessa-s
    name: go-optgen
  prerelease: auto
  name_template: "{{.Tag}}"
