# The nearest .optgen.yaml wins: this file replaces the repository one for
# this package.
defaults:
  all-fields: true
  formatter: gofmt -w
  # Start every default function from a package variable,
  # default<Type>Value, then apply the default= tags on top of it.
  defaults-from: var
  # A failed optcheck keeps the previous value instead of panicking.
  check-failure: skip
  # Slice options take a slice instead of a variadic list.
  slice-setter: slice
  # Every time.Duration field without a default= tag starts at 30s.
  type-defaults:
    time.Duration: 30 * time.Second
